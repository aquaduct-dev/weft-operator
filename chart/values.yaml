replicaCount: 1

image:
  url: {@//cmd:weft_operator_image_push}
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

# GatewayClass managed by this chart. Users point their Gateway objects at
# .Values.gatewayClass.name to route traffic through the weft operator.
# The Gateway API CRDs themselves are NOT installed by this chart — make
# sure the cluster already has gateway.networking.k8s.io installed (e.g.
# via `kubectl apply -f` of the upstream CRD bundle) before enabling this.
gatewayClass:
  # If false, no GatewayClass is created — users must define their own and
  # set its controllerName to "weft.aquaduct.dev/gateway-controller".
  create: true
  name: weft-gateway-class
  # parametersRef optionally points the GatewayClass at a WeftGateway CR
  # holding weft-specific config (e.g. targetServers). Leave unset if you
  # don't need per-class config; the reconciler tolerates a missing ref.
  parametersRef: {}
  #  name: my-weft-gateway
  #  namespace: default
