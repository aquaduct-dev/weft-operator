replicaCount: 1

image:
  url: {@//cmd:weft_operator_image_push}
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

resources:
  limits:
    cpu: 500m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Gateway API CRDs (gateway.networking.k8s.io). A pre-install/pre-upgrade
# hook Job runs `kubectl apply --server-side` against the vendored bundle
# at files/gateway-api-crds.yaml. The Job runs on every release lifecycle
# event — install and each upgrade — so schema updates land when the chart
# is bumped. The CRDs themselves are not owned by this release (Helm never
# sees them), so `helm uninstall` leaves them in place for any other
# Gateway API consumers in the cluster.
gatewayApiCRDs:
  # Set to false if the cluster already manages Gateway API CRDs out of
  # band (e.g. installed by a platform team or another controller).
  install: true
  # kubectl image used by the install Job. Must contain kubectl on PATH.
  # Rancher publishes per-kubectl-version tags (`rancher/kubectl:vX.Y.Z`)
  # under docker.io; we use that instead of bitnami/kubectl because Bitnami
  # moved their registry to sha256-only tags so semver tags like `1.31`
  # no longer resolve.
  image: docker.io/rancher/kubectl:v1.31.0
  imagePullPolicy: IfNotPresent

# GatewayClass managed by this chart. Users point their Gateway objects at
# .Values.gatewayClass.name to route traffic through the weft operator.
gatewayClass:
  # If false, no GatewayClass is created — users must define their own and
  # set its controllerName to "weft.aquaduct.dev/gateway-controller".
  create: true
  name: weft-gateway-class
  # parametersRef optionally points the GatewayClass at a WeftGateway CR
  # holding weft-specific config (e.g. targetServers). Leave unset if you
  # don't need per-class config; the reconciler tolerates a missing ref.
  parametersRef: {}
  #  name: my-weft-gateway
  #  namespace: default
