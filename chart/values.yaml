replicaCount: 1

image:
  url: {@//cmd:weft_operator_image_push}
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# Static resources for the operator container. With the VPA in updateMode: Off
# (below), THESE are the actual runtime values — VPA observes and recommends but
# does not mutate the pod, so the operator runs at exactly request/limit. The
# 128Mi limit OOM-killed the cluster-wide operator (exit 137); steady-state usage
# is ~150Mi with a recommendation around ~335Mi, so 250Mi request / 500Mi limit
# gives headroom without over-reserving. CPU is left static (VPA is memory-only).
resources:
  limits:
    cpu: 500m
    memory: 500Mi
  requests:
    cpu: 10m
    memory: 250Mi

# Vertical Pod Autoscaler for the operator. Manages MEMORY only (CPU stays at the
# static .resources above). With a bundled, auto-installed VPA controller stack so
# the chart is self-contained on clusters that don't already run VPA.
verticalPodAutoscaler:
  # Create a VerticalPodAutoscaler for the operator Deployment.
  enabled: true

  # Whether to install the bundled VPA controller stack (CRDs + recommender +
  # updater + admission-controller + RBAC + webhook), vendored from upstream
  # vertical-pod-autoscaler-1.7.0.
  #   auto  — install only if the cluster has no VPA API yet (or we already own
  #           the install). Leaves an existing cluster-wide VPA untouched.
  #   true  — always install/manage it.
  #   false — never; assume VPA is provided cluster-wide.
  # NOTE: on a cluster with no VPA, the operator's own VPA object attaches on the
  # SECOND `helm upgrade` (the first lays down the CRD/controllers). Re-run the
  # upgrade once to converge.
  installController: auto

  # Off: VPA computes a recommendation (visible in `kubectl get vpa`) but does NOT
  # mutate the pod — the operator runs at the static .resources above. This is
  # deliberate: the shared cluster updater runs --min-replicas=2 and refuses to
  # evict a single-replica pod, so Recreate/Auto can only ever apply on pod
  # creation anyway and otherwise leaves a stale injection in place. Off keeps the
  # runtime resources predictable (250Mi/500Mi) while still surfacing the
  # recommendation, which a future operator self-restart loop could act on.
  updateMode: "Off"

  # Bounds for the observed recommendation (not applied while updateMode is Off).
  minAllowedMemory: 250Mi
  maxAllowedMemory: 1000Mi

  updater:
    # Upstream defaults to 2, which makes the updater skip single-replica targets.
    # weft-operator runs one leader-elected replica, so this must be 1 for Recreate
    # to act on it. Cluster-wide updater flag.
    minReplicas: 1

  # Pinned VPA component images (registry.k8s.io). Bump in lockstep on upgrade.
  images:
    recommender: registry.k8s.io/autoscaling/vpa-recommender:1.7.0
    updater: registry.k8s.io/autoscaling/vpa-updater:1.7.0
    admissionController: registry.k8s.io/autoscaling/vpa-admission-controller:1.7.0

  # Resource requests/limits for the VPA controllers (upstream 1.7.0 defaults).
  resources:
    recommender:
      limits: {cpu: 200m, memory: 1000Mi}
      requests: {cpu: 50m, memory: 500Mi}
    updater:
      limits: {cpu: 200m, memory: 1000Mi}
      requests: {cpu: 50m, memory: 500Mi}
    admissionController:
      limits: {cpu: 200m, memory: 500Mi}
      requests: {cpu: 50m, memory: 200Mi}

nodeSelector: {}

tolerations: []

affinity: {}

# GatewayClass managed by this chart. Users point their Gateway objects at
# .Values.gatewayClass.name to route traffic through the weft operator.
gatewayClass:
  # If false, no GatewayClass is created — users must define their own and
  # set its controllerName to "weft.aquaduct.dev/gateway-controller".
  create: true
  name: weft-gateway-class
  # parametersRef optionally points the GatewayClass at a WeftGateway CR
  # holding weft-specific config (e.g. targetServers). Leave unset if you
  # don't need per-class config; the reconciler tolerates a missing ref.
  parametersRef: {}
  #  name: my-weft-gateway
  #  namespace: default
