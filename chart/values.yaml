replicaCount: 1

image:
  url: {@//cmd:weft_operator_image_push}
  pullPolicy: Always

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

# Static resources for the operator container. Memory is also managed by the VPA
# below (updateMode: Auto) — these values are the floor used before VPA attaches
# and the fallback when verticalPodAutoscaler.enabled=false. The memory limit was
# raised from 128Mi (which OOM-killed the cluster-wide operator, exit 137) to give
# immediate headroom; CPU is left to the static values since the VPA only manages
# memory.
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 10m
    memory: 128Mi

# Vertical Pod Autoscaler for the operator. Manages MEMORY only (CPU stays at the
# static .resources above). With a bundled, auto-installed VPA controller stack so
# the chart is self-contained on clusters that don't already run VPA.
verticalPodAutoscaler:
  # Create a VerticalPodAutoscaler for the operator Deployment.
  enabled: true

  # Whether to install the bundled VPA controller stack (CRDs + recommender +
  # updater + admission-controller + RBAC + webhook), vendored from upstream
  # vertical-pod-autoscaler-1.7.0.
  #   auto  — install only if the cluster has no VPA API yet (or we already own
  #           the install). Leaves an existing cluster-wide VPA untouched.
  #   true  — always install/manage it.
  #   false — never; assume VPA is provided cluster-wide.
  # NOTE: on a cluster with no VPA, the operator's own VPA object attaches on the
  # SECOND `helm upgrade` (the first lays down the CRD/controllers). Re-run the
  # upgrade once to converge.
  installController: auto

  # Auto: the updater evicts+recreates the pod to apply new memory.
  # Initial: only sets memory at pod creation. Off: recommend-only.
  updateMode: Auto

  # Bounds for the memory recommendation applied to the operator.
  minAllowedMemory: 64Mi
  maxAllowedMemory: 512Mi

  updater:
    # Upstream defaults to 2, which makes the updater skip single-replica targets.
    # weft-operator runs one leader-elected replica, so this must be 1 for Auto to
    # act on it. Cluster-wide updater flag.
    minReplicas: 1

  # Pinned VPA component images (registry.k8s.io). Bump in lockstep on upgrade.
  images:
    recommender: registry.k8s.io/autoscaling/vpa-recommender:1.7.0
    updater: registry.k8s.io/autoscaling/vpa-updater:1.7.0
    admissionController: registry.k8s.io/autoscaling/vpa-admission-controller:1.7.0

  # Resource requests/limits for the VPA controllers (upstream 1.7.0 defaults).
  resources:
    recommender:
      limits: {cpu: 200m, memory: 1000Mi}
      requests: {cpu: 50m, memory: 500Mi}
    updater:
      limits: {cpu: 200m, memory: 1000Mi}
      requests: {cpu: 50m, memory: 500Mi}
    admissionController:
      limits: {cpu: 200m, memory: 500Mi}
      requests: {cpu: 50m, memory: 200Mi}

nodeSelector: {}

tolerations: []

affinity: {}

# Honeypot — when enabled, every WeftServer Deployment the operator stamps
# out is augmented with --honeypot-* flags so that *production* weft-server
# pods emit a structured event for each unmatched-host HTTP request and TLS
# handshake error they see. Events POST to the configured ingest URL with
# an auto-generated X-Darkforest-Secret header.
#
# What happens when enabled=true:
#   1. The chart creates a Secret named `<release>-honeypot-ingest` holding
#      a randomly-generated `secret` value (re-used across upgrades via
#      helm lookup so the value stays stable on the consumer side).
#   2. The operator pod gets WEFT_OPERATOR_HONEYPOT_INGEST_URL and
#      WEFT_OPERATOR_HONEYPOT_INGEST_SECRET_NAME env vars.
#   3. WeftServerReconciler reads those env vars and, on every weft-server
#      Deployment it reconciles, appends --honeypot-ingest-url=... plus a
#      WEFT_HONEYPOT_INGEST_SECRET env sourced from the Secret. Existing
#      weft-server functionality (tunnels, ACME, proxying) is unaffected.
#
# A Helm upgrade is all that's needed to turn the fleet on — no per-
# WeftServer config edits, no extra Deployments to manage.
honeypot:
  enabled: false

  # Remote URL each weft-server pod POSTs events to. Required when enabled.
  ingestURL: ""  # e.g. https://aquaduct.dev/api/darkforest/ingest

  # `dst_host` label sent with each event. Empty → the weft-server pod's
  # own hostname (uniquely identifies the bastion in the feed).
  dstHost: ""

  # If set, the chart uses this existing Secret instead of creating its
  # own. The Secret must have a `secret` key matching the consumer side's
  # X-Darkforest-Secret. Leave empty to let the chart auto-generate.
  existingSecret: ""

# GatewayClass managed by this chart. Users point their Gateway objects at
# .Values.gatewayClass.name to route traffic through the weft operator.
gatewayClass:
  # If false, no GatewayClass is created — users must define their own and
  # set its controllerName to "weft.aquaduct.dev/gateway-controller".
  create: true
  name: weft-gateway-class
  # parametersRef optionally points the GatewayClass at a WeftGateway CR
  # holding weft-specific config (e.g. targetServers). Leave unset if you
  # don't need per-class config; the reconciler tolerates a missing ref.
  parametersRef: {}
  #  name: my-weft-gateway
  #  namespace: default
