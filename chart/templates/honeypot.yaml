{{- if .Values.honeypot.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "weft-operator.fullname" . }}-honeypot
  labels:
    {{- include "weft-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: honeypot
spec:
  # One replica only — privileged-port binds can't be load-balanced on
  # the same node, and hostNetwork means a second pod on the same node
  # would crash-loop on EADDRINUSE.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "weft-operator.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: honeypot
  template:
    metadata:
      labels:
        {{- include "weft-operator.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: honeypot
    spec:
      hostNetwork: {{ .Values.honeypot.hostNetwork }}
      {{- with .Values.honeypot.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.honeypot.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.honeypot.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: weft-honeypot
          image: "{{ .Values.honeypot.image.repository }}:{{ .Values.honeypot.image.tag }}"
          imagePullPolicy: {{ .Values.honeypot.image.pullPolicy }}
          args:
            - honeypot
            - "--ports={{ .Values.honeypot.ports }}"
            {{- if .Values.honeypot.bindIP }}
            - "--bind-ip={{ .Values.honeypot.bindIP }}"
            {{- end }}
            {{- if .Values.honeypot.ingest.url }}
            - "--ingest-url={{ .Values.honeypot.ingest.url }}"
            {{- end }}
            {{- if .Values.honeypot.dstHost }}
            - "--dst-host={{ .Values.honeypot.dstHost }}"
            {{- end }}
          env:
            # zerolog ConsoleWriter is pretty but unparseable; force JSON
            # output for log shippers.
            - name: WEFT_ENV
              value: prod
            {{- if and .Values.honeypot.ingest.url .Values.honeypot.ingest.secretRef.name }}
            - name: WEFT_HONEYPOT_INGEST_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.honeypot.ingest.secretRef.name }}
                  key: {{ .Values.honeypot.ingest.secretRef.key | default "secret" }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              # Required to bind privileged ports (22/80/443) as non-root.
              add:
                - NET_BIND_SERVICE
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          resources:
            {{- toYaml .Values.honeypot.resources | nindent 12 }}
{{- end }}
