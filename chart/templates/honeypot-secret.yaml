{{- if and .Values.honeypot.enabled (not .Values.honeypot.existingSecret) }}
# Auto-generated X-Darkforest-Secret value used by every weft-server pod
# the operator stamps out. Helm's `lookup` keeps the value stable across
# upgrades (re-uses the existing Secret's `secret` key when present) so the
# consumer (aquaduct.dev's /api/darkforest/ingest) doesn't need to be
# rotated in lockstep. Set `.Values.honeypot.existingSecret` to bring your
# own pre-created Secret instead.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "weft-operator.honeypotSecretName" . }}
  labels:
    {{- include "weft-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: honeypot
  annotations:
    # Keep the Secret around if the chart is uninstalled while in-flight
    # weft-server pods are still using it — they'd otherwise crash-loop
    # while the operator garbage-collects their Deployments.
    "helm.sh/resource-policy": keep
type: Opaque
data:
  secret: {{ include "weft-operator.honeypotSecretValue" . | b64enc | quote }}
{{- end }}
