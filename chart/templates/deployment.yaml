apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "weft-operator.fullname" . }}
  labels:
    {{- include "weft-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "weft-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "weft-operator.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "weft-operator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.url }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--health-probe-bind-address=:8081"
            - "--metrics-bind-address=127.0.0.1:8080"
            - "--leader-elect"
          {{- if .Values.honeypot.enabled }}
          # Honeypot — propagates to every WeftServer Deployment via the
          # reconciler, which reads these env vars and appends
          # --honeypot-ingest-url plus the corresponding $WEFT_HONEYPOT_
          # INGEST_SECRET env to the pod spec.
          env:
            - name: WEFT_OPERATOR_HONEYPOT_INGEST_URL
              value: {{ required ".Values.honeypot.ingestURL is required when honeypot.enabled=true" .Values.honeypot.ingestURL | quote }}
            - name: WEFT_OPERATOR_HONEYPOT_INGEST_SECRET_NAME
              value: {{ include "weft-operator.honeypotSecretName" . | quote }}
            {{- if .Values.honeypot.dstHost }}
            - name: WEFT_OPERATOR_HONEYPOT_DST_HOST
              value: {{ .Values.honeypot.dstHost | quote }}
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
