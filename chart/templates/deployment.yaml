apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "weft-operator.fullname" . }}
  labels:
    {{- include "weft-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "weft-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "weft-operator.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "weft-operator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.url }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--health-probe-bind-address=:8081"
            - "--metrics-bind-address=127.0.0.1:8080"
            - "--leader-elect"
          env:
            # WeftLocalDNSReflector runs this same image as its node agent.
            - name: WEFT_OPERATOR_IMAGE
              value: "{{ .Values.image.url }}"
            # Image for the reflector proxies (`weft proxy`).
            - name: WEFT_IMAGE
              value: "{{ .Values.weftImage }}"
            # The operator-managed cluster-default WeftLocalDNSReflector.
            - name: DEFAULT_REFLECTOR_ENABLED
              value: {{ .Values.defaultReflector.enabled | quote }}
            - name: DEFAULT_REFLECTOR_NAME
              value: {{ .Values.defaultReflector.name | quote }}
            - name: DEFAULT_REFLECTOR_HOSTNAMES
              value: {{ join "," .Values.defaultReflector.hostnames | quote }}
            # The trust injection webhook is reached through this Service.
            - name: WEBHOOK_SERVICE_NAME
              value: {{ include "weft-operator.fullname" . }}-webhook
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: webhook
              containerPort: 9443
              protocol: TCP
          volumeMounts:
            # Writable dir for the webhook serving certificate (the root
            # filesystem is read-only).
            - name: webhook-certs
              mountPath: /tmp/k8s-webhook-server/serving-certs
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: webhook-certs
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
