{{- if .Values.gatewayClass.create -}}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gatewayClass.name }}
  labels:
    {{- include "weft-operator.labels" . | nindent 4 }}
spec:
  controllerName: weft.aquaduct.dev/gateway-controller
  {{- with .Values.gatewayClass.parametersRef }}
  {{- if and .name .namespace }}
  parametersRef:
    group: weft.aquaduct.dev
    kind: WeftGateway
    name: {{ .name }}
    namespace: {{ .namespace }}
  {{- end }}
  {{- end }}
{{- end }}
