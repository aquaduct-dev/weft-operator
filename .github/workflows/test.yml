name: Test

on:
  push:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Calculate previous run number
        id: calc_prev_run
        run: echo "number=$((${{ github.run_number }} - 1))" >> $GITHUB_OUTPUT

      - name: Restore Bazel cache
        uses: actions/cache/restore@v4
        with:
          path: "/home/runner/.cache/bazel"
          key: bazel-test-${{ steps.calc_prev_run.outputs.number }}
          restore-keys: |
            bazel-test-

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - name: Set up Java (required by Bazel)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Bazelisk
        run: |
          sudo curl -L -o /usr/local/bin/bazelisk https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-amd64
          sudo chmod +x /usr/local/bin/bazelisk
          bazelisk --version

      - name: Test all
        # The firecracker e2e tests (tagged requires-kvm) run in the e2e job.
        # --build_tests_only keeps this job from building their microVM images.
        run: |
          bazelisk test --test_output=streamed --build_tests_only --test_tag_filters=-requires-kvm //...

      - name: Save Bazel cache
        uses: actions/cache/save@v4
        with:
          path: "/home/runner/.cache/bazel"
          key: bazel-test-${{ github.run_number }}

  # The firecracker k3s VM tests (//e2e/..., tagged requires-kvm). A required
  # check on main, and part of the Test workflow the release waits for.
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        # Each VM's rootfs image and preloaded images land in bazel-out.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install host packages
        # Guest kernel build (host toolchain) and mkfs.ext4 for VM images.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential flex bison bc libelf-dev libssl-dev e2fsprogs

      - name: Allow bazel's sandbox (unprivileged user namespaces)
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --settle --name-match=kvm
          ls -l /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::/dev/kvm is not readable and writable by $(id -un)"
            exit 1
          fi

      - name: Install Bazelisk
        run: |
          sudo curl -L -o /usr/local/bin/bazelisk https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-amd64
          sudo chmod +x /usr/local/bin/bazelisk

      # The guest kernel takes ~10-15 min to build; cache only it (the VM
      # images are large and cheap to rebuild). It is pinned by the
      # rules_firecracker commit in MODULE.bazel.
      - name: Restore guest kernel cache
        id: kernel-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/fc-kernel
          key: fc-kernel-${{ runner.os }}-${{ hashFiles('MODULE.bazel') }}
          restore-keys: fc-kernel-${{ runner.os }}-

      - name: Build the guest kernel
        run: bazelisk build --disk_cache=$HOME/.cache/fc-kernel @rules_firecracker//firecracker:vmlinux

      - name: Save guest kernel cache
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/fc-kernel
          key: fc-kernel-${{ runner.os }}-${{ hashFiles('MODULE.bazel') }}

      - name: Test e2e
        # Two VMs at a time: each wants 4 GiB of guest RAM on a 16 GiB runner.
        run: |
          bazelisk test --config=kvm --test_output=errors --local_test_jobs=2 \
            --test_tag_filters=requires-kvm //e2e/...

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-testlogs
          path: bazel-testlogs/**/test.log

